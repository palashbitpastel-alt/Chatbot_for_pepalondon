<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Answer Review</title>
<style>
:root{--bg:#f6f3ef;--card:#fff;--fg:#25211d;--muted:#7a7068;--line:#e4ddd5;--accent:#1f3a5f;
  --good:#2f7a4b;--good-bg:#e7f3eb;--bad:#a8352c;--bad-bg:#f8e6e3;--shopper:#efe9e2}
@media (prefers-color-scheme:dark){:root{--bg:#181614;--card:#221f1c;--fg:#eee8e1;--muted:#a59a8f;--line:#38322c;
  --accent:#8fb0d8;--good:#7fcf9a;--good-bg:#1f3326;--bad:#f09a90;--bad-bg:#3a2320;--shopper:#2c2824;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:22px;margin:0 0 4px}
.lede{color:var(--muted);margin:0 0 20px;max-width:65ch}
.key{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
input,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{width:100%;min-height:70px;resize:vertical}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filters button[aria-pressed=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.convo{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
.convo h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:600}
.msg{padding:10px 12px;border-radius:10px;margin-bottom:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{background:var(--shopper);margin-left:15%}
.msg.assistant{border:1px solid var(--line)}
.msg.good{border-color:var(--good);background:var(--good-bg)}
.msg.bad{border-color:var(--bad);background:var(--bad-bg)}
.who{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;white-space:normal}
.btn-good{color:var(--good)}.btn-bad{color:var(--bad)}
.fix{margin-top:8px;display:grid;gap:6px;white-space:normal}
.fix label{font-size:13px;color:var(--muted)}
.tag{font-size:12px;font-weight:600}
.status{color:var(--muted);margin:12px 0}
</style>
</head>
<body>
<main>
  <h1>Answer review</h1>
  <p class="lede">Mark the assistant's answers. <b>Good</b> answers become examples it follows; for a <b>wrong</b> answer,
    write what it should have said. When a shopper later says something similar, the assistant is shown these before it replies.</p>
  <form class="key" id="keyForm">
    <input id="key" type="password" placeholder="Review key" autocomplete="current-password" required>
    <button class="primary">Open</button>
  </form>
  <div class="filters" id="filters" hidden>
    <button data-f="all" aria-pressed="true">All answers</button>
    <button data-f="todo" aria-pressed="false">Not reviewed</button>
    <button data-f="done" aria-pressed="false">Reviewed</button>
  </div>
  <div id="list"></div>
  <p class="status" id="status"></p>
  <button id="more" hidden>Older conversations</button>
</main>
<script>
const $ = s => document.querySelector(s);
let key = "", offset = 0, filter = "all";
try { key = sessionStorage.getItem("reviewKey") || ""; } catch (e) {}

async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {"Content-Type": "application/json", "X-Review-Key": key, ...(opts.headers || {})}});
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function applyFilter() {
  document.querySelectorAll(".msg.assistant").forEach(m => {
    const done = m.classList.contains("good") || m.classList.contains("bad");
    m.hidden = (filter === "todo" && done) || (filter === "done" && !done);
  });
}

function answer(msg) {
  const box = el("div", "msg assistant");
  const label = el("span", "who", "Assistant");
  const text = el("div", null, msg.content);
  const actions = el("div", "actions");
  const fix = el("div", "fix"); fix.hidden = true;
  const correction = el("textarea"); correction.placeholder = "What it should have said (or how it should have handled it)";
  const note = el("input"); note.placeholder = "Why (optional) - e.g. 'always ask the age first'";
  const saveBad = el("button", "primary", "Save as wrong");
  fix.append(el("label", null, "Better answer"), correction, el("label", null, "Note"), note, saveBad);

  const good = el("button", "btn-good", "Good");
  const bad = el("button", "btn-bad", "Wrong…");
  const undo = el("button", null, "Clear verdict");
  const tag = el("span", "tag");

  function show(review) {
    box.classList.remove("good", "bad");
    tag.textContent = "";
    undo.hidden = !review;
    if (review) {
      box.classList.add(review.verdict);
      tag.textContent = review.verdict === "good" ? "✓ Approved" : "✗ Marked wrong";
      correction.value = review.correction || "";
      note.value = review.note || "";
    }
    applyFilter();
  }
  async function send(verdict) {
    try {
      const review = {verdict, correction: correction.value, note: note.value};
      await api("review/verdict", {method: "POST", body: JSON.stringify({message_id: msg.id, ...review})});
      fix.hidden = true; show(review);
    } catch (e) { alertIn(box, e.message); }
  }
  good.onclick = () => send("good");
  bad.onclick = () => { fix.hidden = !fix.hidden; if (!fix.hidden) correction.focus(); };
  saveBad.onclick = () => send("bad");
  undo.onclick = async () => {
    try { await api("review/verdict/" + msg.id, {method: "DELETE"}); correction.value = ""; note.value = ""; show(null); }
    catch (e) { alertIn(box, e.message); }
  };
  actions.append(good, bad, undo, tag);
  box.append(label, text, actions, fix);
  show(msg.review || null);
  return box;
}

function alertIn(box, text) {
  const p = el("p", "status", text); box.append(p); setTimeout(() => p.remove(), 4000);
}

async function load(more) {
  $("#status").textContent = "Loading…";
  try {
    const data = await api(`review/conversations?limit=15&offset=${offset}`);
    if (!more) $("#list").replaceChildren();
    try { sessionStorage.setItem("reviewKey", key); } catch (e) {}
    $("#filters").hidden = false; $("#keyForm").hidden = true;
    for (const c of data.conversations) {
      const box = el("section", "convo");
      const first = c.messages[0] && c.messages[0].at;
      box.append(el("h2", null, first ? new Date(first + (first.endsWith("Z") ? "" : "Z")).toLocaleString() : c.session_id));
      for (const m of c.messages) {
        if (m.role === "assistant") box.append(answer(m));
        else { const u = el("div", "msg user"); u.append(el("span", "who", "Shopper"), document.createTextNode(m.content)); box.append(u); }
      }
      $("#list").append(box);
    }
    offset += data.conversations.length;
    $("#more").hidden = !data.more;
    $("#status").textContent = offset ? "" : "No conversations yet.";
    applyFilter();
  } catch (e) {
    $("#status").textContent = e.message;
    $("#keyForm").hidden = false;
  }
}

$("#keyForm").onsubmit = e => { e.preventDefault(); key = $("#key").value.trim(); offset = 0; load(false); };
$("#more").onclick = () => load(true);
$("#filters").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll("#filters button").forEach(x => x.setAttribute("aria-pressed", x === b));
  applyFilter();
};
if (key) load(false);
</script>
</body>
</html>
